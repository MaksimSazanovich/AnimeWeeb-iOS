warning_threshold: 20

disabled_rules:
  - colon
  - comma

opt_in_rules:
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - untyped_error_in_catch
  - force_unwrapping
  
custom_rules:
  id_suffix_naming:
    name: "Wrong name"
    regex: "(Id)"
    match_kinds:
      - comment
      - identifier
    message: "Use 'ID' instead 'Id'"
    severity: error

identifier_name:
  excluded:
    - id
    - i
    - j
    - to

cyclomatic_complexity:
  warning: 10
  error: 12

function_body_length:
  warning: 50
  error: 85

function_parameter_count:
  warning: 5
  error: 7
  ignores_default_parameters: true

line_length:
  warning: 165
  error: 190

file_length:
  warning: 600
  error: 760

type_body_length:
  warning: 300
  error: 415
  
included:
  - AnimeWeeb
  - AnimeWeebTests

excluded:
  - Pods
  - .build
  - DerivedData
  - AnimeWeeb/Preview Content
